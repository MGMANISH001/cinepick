<!doctype html>
<html lang="en" class="bg-black">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use the full screen on notched
         phones (paired with env(safe-area-inset-*) padding in the CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>CINEPICK — Find your next favorite film</title>
    <meta
      name="description"
      content="A taste-tuned movie recommendation engine. Tell us how you feel, pick a few moods, and let our similarity scorer surface the films most likely to stick with you."
    />

    <!-- Prevent a white flash before React boots -->
    <style>
      html {
        background: #000;
      }
    </style>
  </head>

  <body class="bg-black text-white antialiased">
    <!-- The whole app mounts here -->
    <div id="root"></div>

    <!-- Vite entry point (npm run dev / npm run build) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
